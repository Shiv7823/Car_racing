<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1630"/>
      <stop offset="100%" stop-color="#04060e"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#00f2fe" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <!-- Speed streaks -->
  <g filter="url(#glow2)" opacity="0.5">
    <line x1="80" y1="160" x2="200" y2="200" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="220" x2="180" y2="240" stroke="#ff2a85" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="350" x2="220" y2="330" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Car body (stylized top-down racing car) -->
  <g transform="translate(256, 256) rotate(-25)" filter="url(#glow)">
    <!-- Main body -->
    <path d="M-20,-100 C-10,-110 10,-110 20,-100 L35,-40 L40,20 L35,70 C30,95 -30,95 -35,70 L-40,20 L-35,-40 Z" 
          fill="none" stroke="url(#car)" stroke-width="4"/>
    <!-- Cockpit -->
    <ellipse cx="0" cy="-20" rx="18" ry="28" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8"/>
    <!-- Front wing -->
    <path d="M-50,-85 L-25,-95 L25,-95 L50,-85" fill="none" stroke="#ff0844" stroke-width="3" stroke-linecap="round"/>
    <!-- Rear wing -->
    <path d="M-55,80 L-30,72 L30,72 L55,80" fill="none" stroke="#ff2a85" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-55,80 L-55,88 M55,80 L55,88" stroke="#ff2a85" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Front wheels -->
    <rect x="-48" y="-72" width="10" height="24" rx="3" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
    <rect x="38" y="-72" width="10" height="24" rx="3" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
    <!-- Rear wheels -->
    <rect x="-52" y="40" width="12" height="28" rx="4" fill="none" stroke="#ff0844" stroke-width="2.5"/>
    <rect x="40" y="40" width="12" height="28" rx="4" fill="none" stroke="#ff0844" stroke-width="2.5"/>
    <!-- Center line -->
    <line x1="0" y1="-90" x2="0" y2="70" stroke="#00f2fe" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Outer glow ring accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.12"/>
</svg>
